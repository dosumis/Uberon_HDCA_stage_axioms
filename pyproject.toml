[project]
name = "taxon-stage-axioms"
version = "0.1.0"
description = "Taxon-scoped developmental stage axioms for Uberon structures"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tsa = "taxon_stage.cli:main"

[project.optional-dependencies]
validate = ["httpx"]
test = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taxon_stage"]
